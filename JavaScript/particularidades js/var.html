<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Var vs Let vs Const</title>
</head>
<body>
    <h1>Var vs Let vs Const</h1>

    <script>
        var teste= "teste"
        var teste= "100"
        console.log(teste)
        function test2(){
            for ( let i=0; i<5; i++){
                console.log(i)
            }
        }
        test2()
    </script>

</body>
</html>
